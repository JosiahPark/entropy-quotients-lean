const SNAPSHOT = {"sha":"4acc054","at":"19 Nov 2026, 01:40 UTC","sorry":2,"theorems":561,"theoremsSorry":0,"ci":{"status":"completed","conclusion":"success","sha":"5bf5c4bb209a869e3826f8c07418f690fe04b8f5"},"roadmap":"# Roadmap\n\nOrdered work list for formalizing arXiv:2610.38525. Items are sized for one change each\n(roughly under 120 new Lean lines) and name their file and theorem names. Take the first\nunchecked item; tick it (`- [x]`) only after CI shows it compiled. The dependency chart in\n[docs/DEPENDENCIES.md](docs/DEPENDENCIES.md) shows how the items connect.\n[docs/roadmap.html](docs/roadmap.html) is an interactive map of this file (open it in a browser; it reads\nthis file live from main). [docs/PARALLEL_EFFORTS.md](docs/PARALLEL_EFFORTS.md) records two independent\nGrok attempts at the same formalization and how they compare with this repository.\n[docs/THEOREMS.md](docs/THEOREMS.md) is the full theorem list: every theorem and lemma of the library, by\nfile, with a link to its source line.\n\nMarkers: `- [ ]` open, `- [x]` done and compiled, `- [-]` deliberately skipped (with a reason).\n\nStatus (2026-11-19): every item of the work list is done. G4, the constant 263, is listed under\nPending generalizations and is not scheduled. Sections H–J, special cases of (35) that B1 made\nunnecessary, are recorded under Superseded by B1. New sections are added only at Josiah's request.\n\nRules: no `sorry` in a ticked item, no `axiom`, `opaque`, `admit`, `native_decide` or `unsafe`.\nAn analytic input that is not proved here enters as a named hypothesis or structure field, never\nas a hidden assumption. No item claims that Theorem 1.1 is proved until its proof has no `sorry`\nand no hypotheses beyond the paper's.\n\nImports: a file of the library that needs Mathlib starts with `import EntropyLean.MathlibForPFR`,\nnot with `import Mathlib` (item B1d1 gives the reason). `FeatureMap.lean` is the one exception.\n\n## Done (v0.2, CI-verified at 9130247)\n\n- [x] Definitions: `entropyBits`, `conv`, `entropyIncrement`, `entropyDefect`, `interaction`,\n      `quotientLoss`, `IsSparse` (`EntropyLean/Basic.lean`); `WeightedFamily`, `meanEntropy`,\n      `meanInteraction`, `averagedLoss`, `WeightedFamily.IsSparse`, `quotient`, `convFamily`\n      (`EntropyLean/Families.lean`).\n  - Written in the v0.2 consolidation, before the roadmap tasks; CI green at 9130247.\n- [x] Identities: `entropyBits_eq_sum`, `entropyDefect_eq`, `interaction_self`,\n      `meanEntropy_quotient`, `conv_weights_sum`.\n  - Written in the v0.2 consolidation, before the roadmap tasks; CI green at 9130247.\n- [x] `bernoulli_parameter_mem_Ioo`; `entropy_le_increment_of_defect_le` (the algebraic step in\n      the proof of Theorem 1.1).\n  - Written in the v0.2 consolidation, before the roadmap tasks; CI green at 9130247.\n- [x] Statements with `sorry`: Theorem 1.1, Theorem 1.2, Theorem 8.2, Lemma 4.1, Lemma 9.1,\n      Proposition 9.3 (`EntropyLean/Statements.lean`).\n  - Written in the v0.2 consolidation; CI green at 9130247. Lemma 4.1, Lemma 9.1 and\n    Proposition 9.3 were proved later (C4, C1, E3), and Theorems 1.1, 1.2 and 8.2 in B1f.\n\n## A. Entropy basics (`EntropyLean/Basic.lean` or `EntropyLean/EntropyFacts.lean`)\n\n- [x] A1. `negMulLogb_nonneg`: `0 ≤ -p * logb 2 p` for `0 ≤ p ≤ 1`; `entropyBits_nonneg` for a\n      law on a finite type.\n  - Written by the hourly task 2026-11-13 (uncompiled at push): `negMulLogb_nonneg`,\n    `pmf_toReal_le_one`, `entropyBits_term_nonneg`, `entropyBits_nonneg`, `entropyBits_nonneg'`\n    (`EntropyLean/EntropyFacts.lean`).\n- [x] A2. `entropyBits_pure`: `entropyBits (PMF.pure a) = 0`; `entropyBits_le_log_card`:\n      `entropyBits P ≤ logb 2 (Fintype.card α)`.\n  - Written by the hourly task 2026-11-13 (uncompiled at push): `entropyBits_pure`,\n    `neg_mul_log_le_gibbs`, `pmf_sum_toReal`, `entropyBits_le_log_card`\n    (`EntropyLean/EntropyFacts.lean`).\n- [x] A3. `entropyBits_map_le`: `H(f ∘ X) ≤ H(X)` for `PMF.map f` function parseRoadmap(text) {

      band = {key: m ? m[1] : (/^done/i.test(t) ? "Done" : t.slice(0, 12)), title: m ? m[2] : t, intro: [], items: []};
      bands.push(band); continue;
    }
    if (list) { const b = raw.match(/^-\s+(.*)$/); if (b) list.entries.push(b[1]); else if (raw.trim() && list.entries.length) list.entries[list.entries.length - 1] += " " + raw.trim(); else if (raw.trim()) list.intro.push(raw.trim()); continue; }
    if (!band) continue;
    const it = raw.match(/^-\s+\[( |x|X|-)\]\s+(.*)$/);
    if (it) {
      let t = it[2], id; const idm = t.match(/^([A-Z]\d+[a-z]*)\.\s+(.*)$/);
      if (idm) { id = idm[1]; t = idm[2]; } else id = (band.key === "Done" ? "V" : band.key) + (band.items.length + 1);
      item = {id, mark: it[1].toLowerCase(), text: t, notes: [], depth: [], band: band.key};
      band.items.push(item); items.push(item); continue;
    }
    const sub = raw.match(/^(\s{2,8})-\s+(.*)$/);
    if (sub && item) { item.notes.push(sub[2]); item.depth.push(Math.max(0, (sub[1].length - 2) >> 1)); continue; }

function hot(id) {

const pill = s => `<span class="pill p-${s}">${esc(STATUS_TEXT[s] || RES_TEXT[s] || s)}</span>`;

function noteHtml(n, depth) {
  const pad = depth ? ` style="margin-left:${depth * 14}px"` : "";

  }

function select(id, scroll) {

    ${needs.length ? `<h3>Needs${blocked.length ? ` · ${blocked.length} not done` : " · all done"}</h3><div class="refs">${needs.map(refBtn).join("")}</div>` : ""}

function scrollTo(x, y) { wrap.scrollTo({left: x * scale - wrap.clientWidth / 2, top: y * scale - wrap.clientHeight / 3, behavior: "smooth"}); }
function intro() {

function setScale(s) { scale = Math.max(.35, Math.min(2.2, s)); svg.setAttribute("width", M.L.W * scale); svg.setAttribute("height", M.L.H * scale); }

let dr = null;

// Theorem and lemma declarations in one Lean file, and how many of them contain sorry.
function countTheorems(t) {
  const DECL = /^(?:@\[[^\]\n]*\]\s*)?(?:(?:private|protected|noncomputable|nonrec|partial|unsafe)\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class|inductive|example|opaque|axiom|end|section|namespace|variable|open|omit|universe|attribute|set_option|include|#\w+)\b/;
  const THM = /^(?:@\[[^\]\n]*\]\s*)?(?:(?:private|protected|nonrec)\s+)*(?:theorem|lemma)\b/;
  let n = 0, ns = 0, cur = null;
  for (const line of t.replace(/\/-[\s\S]*?-\//g, "").replace(/--.*$/gm, "").split("\n")) {
    if (DECL.test(line)) { if (cur !== null) { n++; if (cur) ns++; } cur = THM.test(line) ? /\bsorry\b/.test(line) : null; }
    else if (cur !== null && /\bsorry\b/.test(line)) cur = true;
  }
  if (cur !== null) { n++; if (cur) ns++; }
  return [n, ns];
}
async function live() {

    const [roadmap, deps] = await Promise.all([raw("ROADMAP.md"), raw("docs/DEPENDENCIES.md")]);
    const next = {...src, roadmap, deps, live: true, at: new Date().toLocaleString([], {dateStyle: "medium", timeStyle: "short"})};
    try {
      const runs = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/lean.yml/runs?per_page=1&branch=main`).then(r => r.json());
      const r0 = runs.workflow_runs[0]; next.ci = {status: r0.status, conclusion: r0.conclusion, sha: r0.head_sha, title: r0.display_title};
      const tree = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${r0.head_sha}?recursive=1`).then(r => r.json());
      const files = tree.tree.map(x => x.path).filter(p => /^EntropyLean\/[^/]+\.lean$/.test(p));

      next.theoremsSorry = counts.reduce((n, c) => n + c[1], 0);

  } catch (e) { render(); renderSrc(); }
}
