const SNAPSHOT = {"sha": "2b471eb", "at": "13 Nov 2026, 17:50 UTC", "sorry": 8, "ci": {"status": "completed", "conclusion": "success", "sha": "2b471eb1226ff6f3cfd17b5ae700dc8ac06196b0"}, "roadmap": "# Roadmap\n\nOrdered work list for formalizing arXiv:2610.38525. Items are sized for one change each\n(roughly under 120 new Lean lines) and name their file and theorem names. Take the first\nunchecked item; tick it (`- [x]`) only after CI shows it compiled. The dependency chart in\n[docs/DEPENDENCIES.md](docs/DEPENDENCIES.md) shows how the items connect.\n\nMarkers: `- [ ]` open, `- [x]` done and compiled, `- [-]` deliberately skipped (with a reason).\n\nRules: no `sorry` in a ticked item, no `axiom`, `opaque`, `admit`, `native_decide` or `unsafe`.\nAn analytic input that is not proved here enters as a named hypothesis or structure field, never\nas a hidden assumption. No item claims that Theorem 1.1 is proved until its proof has no `sorry`\nand no hypotheses beyond the paper's.\n\n## Done (v0.2, CI-verified at 9130247)\n\n- [x] Definitions: `entropyBits`, `conv`, `entropyIncrement`, `entropyDefect`, `interaction`,\n      `quotientLoss`, `IsSparse` (`EntropyLean/Basic.lean`); `WeightedFamily`, `meanEntropy`,\n      `meanInteraction`, `averagedLoss`, `WeightedFamily.IsSparse`, `quotient`, `convFamily`\n      (`EntropyLean/Families.lean`).\n- [x] Identities: `entropyBits_eq_sum`, `entropyDefect_eq`, `interaction_self`,\n      `meanEntropy_quotient`, `conv_weights_sum`.\n- [x] `bernoulli_parameter_mem_Ioo`; `entropy_le_increment_of_defect_le` (the algebraic step in\n      the proof of Theorem 1.1).\n- [x] Statements with `sorry`: Theorem 1.1, Theorem 1.2, Theorem 8.2, Lemma 4.1, Lemma 9.1,\n      Proposition 9.3 (`EntropyLean/Statements.lean`).\n\n## A. Entropy basics (`EntropyLean/Basic.lean` or `EntropyLean/EntropyFacts.lean`)\n\n- [x] A1. `negMulLogb_nonneg`: `0 ≤ -p * logb 2 p` for `0 ≤ p ≤ 1`; `entropyBits_nonneg` for a\n      law on a finite type.\n  - Written by the hourly task 2026-11-13 (uncompiled at push): `negMulLogb_nonneg`,\n    `pmf_toReal_le_one`, `entropyBits_term_nonneg`, `entropyBits_nonneg`, `entropyBits_nonneg'`\n    (`EntropyLean/EntropyFacts.lean`).\n- [ ] A2. `entropyBits_pure`: `entropyBits (PMF.pure a) = 0`; `entropyBits_le_log_card`:\n      `entropyBits P ≤ logb 2 (Fintype.card α)`.\n  - Written by the hourly task 2026-11-13 (uncompiled at push): `entropyBits_pure`,\n    `neg_mul_log_le_gibbs`, `pmf_sum_toReal`, `entropyBits_le_log_card`\n    (`EntropyLean/EntropyFacts.lean`).\n- [ ] A3. `entropyBits_map_le`: `H(f ∘ X) ≤ H(X)` for `PMF.map f` on finite types (data\n      processing for a function); `entropyBits_map_injective`: equality for injective `f`.\n- [ ] A4. `conv_map_hom`: for an additive map `q`, `(conv P Q).map q = conv (P.map q) (Q.map q)`\n      (quotient commutes with convolution, used in Lemma 4.1).\n- [ ] A5. `WeightedFamily.quotient_quotient`: quotienting by `G`, then by `W ≤ V ⧸ G`, equals\n      quotienting by the inverse image of `W` (entropy-level statement), used in Lemma 9.1.\n\n## B. Information-theory layer\n\n- [ ] B1. Decide the entropy backend and record the decision here: (i) continue with the\n      `PMF`-based definitions, or (ii) depend on the PFR project (github.com/teorth/pfr), which\n      formalizes Shannon entropy, Ruzsa distance and an entropic PFR theorem. Check its\n      toolchain against Lean 4.35.0 and whether its constant matches the 6 in (35). If (ii),\n      prove `entropyBits` agrees with PFR's entropy divided by `log 2`.\n- [ ] B2. Conditional entropy and mutual information for finite joint laws; chain rule;\n      `I(A;B|C) ≥ 0` (`EntropyLean/Information.lean`).\n- [ ] B3. Equation (9): `interaction_nonneg`, `interaction_le_left`, `interaction_le_right`;\n      equation (14): `0 ≤ e(𝒫) ≤ h(𝒫)` (`meanInteraction_nonneg`, `meanInteraction_le`).\n- [ ] B4. Equation (15): `meanEntropy_convFamily : h(𝒫 * 𝒫) = 2h(𝒫) − e(𝒫)`.\n- [ ] B5. Data processing for the increment: `entropyIncrement_quotient_le : D(q_G X) ≤ D(X)`.\n- [ ] B6. Lemma 2.1: `quotient_entropy_supermodular` (equation (11)).\n\n## C. Variational steps and the reduction of Theorem 1.1\n\n- [ ] C1. Lemma 9.1: prove `variational_sparsification` by minimizing `h(q_G 𝒫) + λ dim G`\n      over the finite set of subspaces (needs A1, A5).\n- [ ] C2. Conditional Theorem 1.1: `exponential_entropy_quotient_of_rigidity`, proving the\n      statement of Theorem 1.1 from Lemma 9.1, B5, `entropy_le_increment_of_defect_le` and\n      Theorem 8.2 taken as an explicit hypothesis. Also the singleton family\n      `WeightedFamily.singleton` and `meanEntropy_singleton`.\n- [ ] C3. Theorem 1.2 from Theorem 8.2: `sparse_rigidity_of_family_rigidity` via the singleton\n      family (Theorem 8.2 as an explicit hypothesis).\n- [ ] C4. Lemma 4.1: prove `ratio_preserving_sparsification` from the objective (24) (needs A4,\n      B3, B4).\n- [ ] C5. Corollary 9.2: statement, and its proof from Lemma 9.1, B5 and Theorem 8.2 as a\n      hypothesis.\n\n## D. Rigidity core (Sections 2.3, 3, 5–8)\n\n- [ ] D1. Iteration arithmetic of Theorem 8.2, pure real analysis: from (43) derive\n      `d * logb 2 (1/λ) < 320` for `0 < d ≤ 1` (`EntropyLean/RigidityArith.lean`).\n- [ ] D2. Theorem 8.2 from Lemma 8.1: `weighted_family_rigidity_of_growth`, with Lemma 8.1 as an\n      explicit hypothesis, using D1.\n- [ ] D3. Posterior families: `WeightedFamily.posterior` and Lemma 2.2 (`posterior_closure`).\n- [ ] D4. Lemma 3.1: fibring identity (20) and the nested inequality (22).\n- [ ] D5. Lemma 5.1: averaged density estimate (28)–(29).\n- [ ] D6. Lemma 6.1 (four-sample splitting), Lemma 6.2 (conditional BSG), Lemma 6.3.\n- [ ] D7. `structure MartonInput`: the entropic Marton bound (35) as a named hypothesis, and its\n      consequence (36). Replace by a theorem if B1 chooses the PFR backend and the constant\n      matches.\n- [ ] D8. Lemma 7.1 from D4–D7.\n- [ ] D9. Lemma 8.1 from C4, D3, D6, D8.\n\n## E. Proposition 9.3 (independent of Theorem 8.2)\n\n- [ ] E1. `entropyBits` of a Bernoulli law on `ZMod 2` equals `binaryEntropy p`; the sum of two\n      independent Bernoulli(p) bits is Bernoulli(2p(1−p)).\n- [ ] E2. Bernoulli expansions: `binaryEntropy p = p logb 2 (1/p) + p logb 2 e + O(p²)` and\n      `bernoulliDefect p = 2p + O(p² log(1/p))` as explicit inequalities for small `p`.\n- [ ] E3. Prove `exponential_scale_necessary` from E1, E2 and `bernoulli_parameter_mem_Ioo`.\n\n## F. Corollary 9.4\n\n- [ ] F1. Statement of Corollary 9.4 and its proof from Theorem 1.1 (as a hypothesis until\n      Theorem 1.1 is proved).\n\n## G. Tracking and improving the constant 320\n\nThe exponent `2^(320(1+ε)/ε)` in Theorem 1.1 comes from the iteration arithmetic (42)–(43)\n(item D1) and, through it, from the constant 6 in the entropic Marton bound (35) and the constants\n12, 13 in (36). These items make that dependence explicit in Lean and then look for slack. They\ncome after A–F on purpose: none of them blocks Theorem 1.1. No item may claim a constant below\nwhat its proof actually gives.\n\n- [ ] G1. Parametric iteration arithmetic (`EntropyLean/RigidityArith.lean`): redo D1 with the\n      Marton constant `C` and the constants of (36) as real parameters, deriving\n      `d * logb 2 (1/λ) < K` for an explicit expression `K` in them\n      (`rigidity_arith_param`), and recover D1 by `K ≤ 320` at `C = 6`\n      (`rigidity_arith_param_six`).\n- [ ] G2. Constant as a field: give D7's `MartonInput` its constant as a field `C` (with (36)\n      in terms of `C`), and restate the conditional Theorem 1.1 of C2 with exponent\n      `K(C) * (1+ε)/ε` (`exponential_entropy_quotient_of_rigidity_const`), so that any\n      better Marton constant gives a better exponent with no further work.\n- [ ] G3. Slack in the paper's argument: find the smallest constant `c₀` that the arithmetic of\n      (42)–(43) gives at `C = 6` (prove `K(6) ≤ c₀`), and if `c₀ < 320` state Theorem 1.1\n      with `c₀`. Record in this file where the slack came from, so Josiah can check it against\n      the paper.\n- [ ] G4. Constant from the PFR backend: only if B1 chooses PFR, check which Marton constant\n      that project proves and instantiate G2 with it.\n\n## Not attempted here\n\n- Improving the constant beyond what the paper's argument gives (a new proof of Theorem 8.2 with\n  a better iteration); item G only tracks and tightens the existing argument.\n\n- A proof of the entropic Marton theorem itself (Gowers–Green–Manners–Tao); it is the paper's\n  one external input.\n- Constructive or algorithmic versions (Section 10).\n", "deps": "# Result dependency chart\n\nHow the results of arXiv:2610.38525 depend on each other, and how far each one is in Lean.\nAn arrow `A → B` means the paper's proof of B uses A. Colours give the Lean status at commit\ntime; [ROADMAP.md](../ROADMAP.md) is the ordered work list that moves nodes from grey to green.\n\n| Colour | Meaning |\n| --- | --- |\n| green | proved in Lean (no `sorry`) |\n| amber | stated in Lean, proof is `sorry` |\n| grey | not yet stated in Lean |\n| blue | external input (cited, not proved in the paper) |\n\n```mermaid\nflowchart TD\n  classDef proved fill:#d4edda,stroke:#2e7d32,color:#1b3d1f\n  classDef stated fill:#fff3cd,stroke:#b8860b,color:#4d3800\n  classDef missing fill:#eceff1,stroke:#78909c,color:#263238\n  classDef external fill:#dbe9f7,stroke:#1f5fa8,color:#0d2a4d\n\n  %% Definitions and elementary identities\n  DEF[\"Definitions: H, convolution, D, E, s, F_P(W),<br/>sparsity, weighted families, q_G 𝒫, 𝒫 * 𝒫<br/>(Basic, Families)\"]:::proved\n  ID[\"Identities: E = H − D, s(P,P) = E(P),<br/>h(q_G 𝒫) = h(𝒫) − F_𝒫(G), weights a_i a_j sum to 1\"]:::proved\n  ALG[\"Algebraic step: E(Z) ≤ θH(Z) ⇒ H(Z) ≤ (1+ε)D(Z)<br/>entropy_le_increment_of_defect_le\"]:::proved\n  BPAR[\"2^(−c/ε) ∈ (0,1)<br/>bernoulli_parameter_mem_Ioo\"]:::proved\n\n  %% Entropy toolkit (Section 2)\n  NN[\"H ≥ 0, chain rule,<br/>I(A;B|C) ≥ 0\"]:::m function hot(id) {
  for (const p of svg._edges || []) { const on = id && (p.dataset.a === id || p.dataset.b === id); p.classList.toggle("hot", !!on); p.classList.toggle("dim", !!id && !on); }
  svg.querySelectorAll(".node,.rnode").forEach(n => n.classList.toggle("sel", n.dataset.id === sel));
}
const pill = s => `<span class="pill p-${s}">${esc(STATUS_TEXT[s] || RES_TEXT[s] || s)}</span>`;
function refBtn(id) {
  const it = M.byId[id], r = M.results.find(x => x.id === id);
  const col = it ? STATUS_COL[it.status] : r ? ({proved: "var(--paper)", stated: "var(--cond)", missing: "var(--supp)", external: "var(--ext)"}[r.status]) : "var(--supp)";
  return `<button class="ref" data-ref="${esc(id)}"><span class="dot" style="background:${col}"></span>${esc(it ? id + " " + it.short : r ? r.name : id)}</button>`;
}
function wireRefs() {
  side.querySelectorAll("[data-ref]").forEach(b => b.addEventListener("click", () => { const id = b.dataset.ref; M.byId[id] ? select(id, true) : selectResult(id, true); }));
}
function select(id, scroll) {
  sel = id; hot(id);
  const it = M.byId[id], band = M.bands.find(b => b.key === it.band);
  const needs = M.deps[id] || [], unl = M.usedBy[id] || [], fd = M.feeds[id] || [];
  const blocked = needs.filter(d => M.byId[d].status !== "done");
  side.innerHTML = `<h2>${esc(id)} · ${esc(it.short)}</h2>
    <div class="area">${esc(band.key === "Done" ? band.title : band.key + ". " + band.title.replace(/\s*\(`[^)]*\)\s*$/, ""))}${CFG.bandRef[band.key] ? " · " + esc(CFG.bandRef[band.key]) : ""}</div>
    <div>${pill(it.status)}${it.next ? pill("next") : ""}</div>
    <p style="margin-top:10px">${md(it.text)}</p>
    ${it.notes.map(n => `<div class="note${/written by the hourly task/i.test(n) ? "" : " plain"}">${md(n)}</div>`).join("")}
    ${it.next ? `<div class="note plain">The hourly task takes this item on its next run: it is the first open item, after any item still awaiting CI, skipping B1 and skipped items.</div>` : ""}
    ${it.status === "decision" ? `<div class="note plain">This is Josiah's decision; the hourly task skips it and keeps the PMF-based definitions.</div>` : ""}
    ${it.files.length ? `<h3>Files</h3><div class="refs">${it.files.map(f => `<a class="ref" href="https://github.com/${REPO}/blob/main/${esc(f)}" target="_blank" rel="noopener">${esc(f)}</a>`).join("")}</div>` : ""}
    ${needs.length ? `<h3>Needs${blocked.length ? ` · ${blocked.length} not done` : " · all done"}</h3><div class="refs">${needs.map(refBtn).join("")}</div>` : ""}
    ${unl.length ? `<h3>Unlocks</h3><div class="refs">${unl.map(refBtn).join("")}</div>` : ""}
    ${fd.length ? `<h3>Feeds</h3><div class="refs">${fd.map(refBtn).join("")}</div>` : ""}`;
  wireRefs();
  if (scroll) scrollTo(it.x + M.L.NW / 2, it.y);
}
function selectResult(id, scroll) {
  sel = id; hot(id);
  const r = M.results.find(x => x.id === id);
  const extra = {T11: "Not claimed proved until its proof has no sorry and no hypotheses beyond the paper's. C2 gives it with Theorem 8.2 as an explicit hypothesis.",
    T82: "Carries the depth of the paper: Lemmas 4.1, 5.1, 6.1–6.3, 7.1 and 8.1 all feed it (section D).",
    MAR: "Gowers–Green–Manners–Tao. The paper's one external input; it enters Lean as a named structure field (D7), never as an axiom.",
    P93: "Independent of Theorem 8.2: it needs only Bernoulli calculus."}[id];
  side.innerHTML = `<h2>${esc(r.name)}</h2><div class="area">${esc(r.sub)}</div><div>${pill(r.status)}</div>
    ${extra ? `<p style="margin-top:10px">${esc(extra)}</p>` : ""}
    <h3>Roadmap items</h3><div class="refs">${r.items.map(refBtn).join("") || "<span class='hint'>none yet</span>"}</div>`;
  wireRefs();
  if (scroll) scrollTo(r.x + r.w / 2, r.y);
}
function scrollTo(x, y) { wrap.scrollTo({left: x * scale - wrap.clientWidth / 2, top: y * scale - wrap.clientHeight / 3, behavior: "smooth"}); }
function intro() {
  const na = M.R.notAttempted;
  side.innerHTML = `<h2>How to read the roadmap</h2><div class="hint">
    <p>Each box is one roadmap item, in its section of ROADMAP.md. Its bar shows its state: <b style="color:var(--paper)">done</b> (ticked after CI compiled it), <b style="color:var(--cond)">awaiting CI</b> (written by the hourly task, not yet ticked), <b>open</b>, or dashed when skipped or left to Josiah.</p>
    <p>Solid lines join an item to the items it needs. Dashed lines run to the paper results on the right, coloured by their Lean status: proved, stated with <code>sorry</code>, not yet stated, or external.</p>
    <p>The box outlined in blue is the next item the hourly task will take. Select any box for its full text, files, and what it needs and unlocks.</p>
    ${na.length ? `<h3>Not attempted here</h3><ul>${na.map(n => `<li>${md(n)}</li>`).join("")}</ul>` : ""}</div>
    <div class="src" id="srcnote"></div>`;
  renderSrc();
}
function renderSrc() {
  const n = document.getElementById("srcnote");
  if (n) n.textContent = src.live ? `Read live from main at ${src.at}.` : `Snapshot of commit ${src.sha} (${src.at}); live data could not be fetched here.`;
}
function stats() {
  const its = M.R.items, c = s => its.filter(i => i.status === s).length;
  const total = its.length, ci = src.ci;
  const ciTxt = ci ? (ci.status !== "completed" ? "running" : ci.conclusion === "success" ? "passing" : "failing") : "–";
  const ciCol = ciTxt === "passing" ? "var(--paper)" : ciTxt === "failing" ? "var(--open)" : "var(--cond)";
  document.getElementById("stats").innerHTML =
    `<div class="stat"><b>${c("done")}/${total}</b><span>items done</span></div>` +
    `<div class="stat"><b style="color:var(--cond)">${c("written")}</b><span>awaiting CI</span></div>` +
    `<div class="stat"><b style="color:var(--supp)">${c("open") + c("decision")}</b><span>open</span></div>` +
    `<div class="stat"><b>${src.sorry ?? "–"}</b><span>sorry left</span></div>` +
    `<div class="stat"><b style="color:${ciCol}">${ciTxt}</b><span>CI ${ci ? esc(ci.sha.slice(0, 7)) : ""}</span></div>` +
    (M.next ? `<div class="stat link" id="nextstat" role="button" tabindex="0"><b style="color:var(--accent)">${esc(M.next.id)}</b><span>next item</span></div>` : "");
  const ns = document.getElementById("nextstat");
  if (ns) { ns.onclick = () => select(M.next.id, true); ns.onkeydown = e => { if (e.key === "Enter") select(M.next.id, true); }; }
  document.getElementById("built").textContent = src.live ? `Live from main, ${src.at}.` : `Snapshot of ${src.sha}, ${src.at}.`;
}
function render() {
  M = model(src); stats(); draw();
  if (sel && (M.byId[sel])) select(sel); else if (sel && M.results.find(r => r.id === sel)) selectResult(sel); else intro();
  if (!fitted) { setScale(Math.min(1, (wrap.clientWidth || M.L.W) / M.L.W)); fitted = true; }
}
function setScale(s) { scale = Math.max(.35, Math.min(2.2, s)); svg.setAttribute("width", M.L.W * scale); svg.setAttribute("height", M.L.H * scale); }
document.getElementById("zin").onclick = () => setScale(scale * 1.2);
document.getElementById("zout").onclick = () => setScale(scale / 1.2);
document.getElementById("zfit").onclick = () => setScale(wrap.clientWidth / M.L.W);
document.querySelectorAll(".chip[data-f]").forEach(b => b.addEventListener("click", () => { const f = b.dataset.f; filt[f] = !filt[f]; b.setAttribute("aria-pressed", String(filt[f])); draw(); }));
let dr = null;
wrap.addEventListener("pointerdown", e => { if (e.target.closest(".node,.rnode")) return; dr = {x: e.clientX, y: e.clientY, l: wrap.scrollLeft, t: wrap.scrollTop}; wrap.classList.add("drag"); });
addEventListener("pointermove", e => { if (!dr) return; wrap.scrollLeft = dr.l - (e.clientX - dr.x); wrap.scrollTop = dr.t - (e.clientY - dr.y); });
addEventListener("pointerup", () => { dr = null; wrap.classList.remove("drag"); });
function applySearch() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  svg.querySelectorAll(".node").forEach(n => {
    const it = M.byId[n.dataset.id];
    const hit = !q || (it.id + " " + it.short + " " + it.text + " " + it.notes.join(" ")).toLowerCase().includes(q);
    n.style.opacity = hit ? "" : ".15";
  });
}
document.getElementById("q").addEventListener("input", applySearch);

async function live() {
  const raw = p => fetch(`https://raw.githubusercontent.com/${REPO}/main/${p}?t=${Date.now()}`, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
  try {
    const [roadmap, deps] = await Promise.all([raw("ROADMAP.md"), raw("docs/DEPENDENCIES.md")]);
    const next = {...src, roadmap, deps, live: true, at: new Date().toLocaleString([], {dateStyle: "medium", timeStyle: "short"})};
    try {
      const runs = await fetch(`https://api.github.com/repos/${REPO}/actions/runs?per_page=1&branch=main`).then(r => r.json());
      const r0 = runs.workflow_runs[0]; next.ci = {status: r0.status, conclusion: r0.conclusion, sha: r0.head_sha, title: r0.display_title};
      const tree = await fetch(`https://api.github.com/repos/${REPO}/git/trees/${r0.head_sha}?recursive=1`).then(r => r.json());
      const files = tree.tree.map(x => x.path).filter(p => /^EntropyLean\/[^/]+\.lean$/.test(p));
      const texts = await Promise.all(files.map(f => fetch(`https://raw.githubusercontent.com/${REPO}/${r0.head_sha}/${f}`).then(r => r.text())));
      next.sorry = texts.reduce((n, t) => n + (t.replace(/\/-[\s\S]*?-\//g, "").replace(/--.*$/gm, "").match(/\bsorry\b/g) || []).length, 0);
    } catch (e) { /* keep snapshot CI and sorry count */ }
    src = next; render();
  } catch (e) { renderSrc(); }
}
render();
live();
</script>

</body>
